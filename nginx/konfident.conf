# ==============================================================================
# Konfident Interview 2025 — High-Concurrency NGINX Load Balancer Configuration
# ==============================================================================
# Optimized for:
# - High-volume bursty student & mentor booking requests
# - Persistent long-session admin analytics
# - Zero-latency Google Meet / Calendar offloading
# ==============================================================================

# Upstream Node.js Cluster with least_conn algorithm
# least_conn ensures requests are routed to the worker with the lowest active connection count,
# preventing heavy admin report exports from stalling fast student slot claims.
upstream konfident_cluster {
    least_conn;

    # Clustered worker instances or multi-port instances
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s backup;

    # Maintain open persistent TCP connections to upstream workers to eliminate handshake latency
    keepalive 64;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general_rate:10m rate=40r/s;
limit_req_zone $binary_remote_addr zone=burst_booking:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name konfident.internal konfident.edu localhost;

    # Redirect all HTTP to HTTPS in production
    # return 301 https://$host$request_uri;

    # Client body buffers for large form submissions and reports
    client_max_body_size 16M;
    client_body_buffer_size 128k;

    # Proxy buffer optimizations (reduces disk I/O under high concurrency)
    proxy_buffers 16 32k;
    proxy_buffer_size 64k;
    proxy_busy_buffers_size 128k;
    proxy_temp_file_write_size 128k;

    # Gzip dynamic compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static Asset Offloading (Served directly by NGINX with aggressive browser caching)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2|woff|ttf|eot)$ {
        root /var/www/konfident/public;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        try_files $uri @node_proxy;
    }

    # Burst Slot Booking Protection
    location /student/book {
        limit_req zone=burst_booking burst=20 nodelay;
        proxy_pass http://konfident_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health Check Endpoint
    location /health {
        proxy_pass http://konfident_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Main Reverse Proxy Route
    location / {
        limit_req zone=general_rate burst=50 nodelay;

        proxy_pass http://konfident_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keepalive timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location @node_proxy {
        proxy_pass http://konfident_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
